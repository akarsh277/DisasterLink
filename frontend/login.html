<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — DisasterLink</title>
  <meta name="description" content="Login to DisasterLink as Admin or Volunteer to access the command center." />
  <link rel="stylesheet" href="style.css?v=2" />
  <style>
    body {
      background-color: #0d1117; /* Very dark background */
      color: #c9d1d9;
    }
    .auth-wrap {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
    .role-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
    }
    .role-card {
      position: relative;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
    }
    .role-card:hover {
      border-color: #8b949e;
    }
    .role-card.active {
      border-color: #3b82f6;
      background: linear-gradient(180deg, rgba(59,130,246,0.1) 0%, rgba(22,27,34,1) 100%);
      box-shadow: 0 0 20px rgba(59,130,246,0.15);
    }
    .role-card .indicator {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      width: 8px;
      height: 8px;
      background-color: #60a5fa;
      border-radius: 50%;
      box-shadow: 0 0 6px #60a5fa;
    }
    .role-card.active .indicator {
      display: block;
    }
    .role-card .icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .role-card .title {
      font-weight: 700;
      color: #ffffff;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    .role-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      letter-spacing: 0.05em;
    }
    .badge-command {
      background: rgba(30, 58, 138, 0.5);
      color: #60a5fa;
    }
    .badge-field {
      background: rgba(6, 78, 59, 0.5);
      color: #34d399;
    }
    .form-label {
      color: #c9d1d9 !important;
      font-weight: 600;
    }
    .form-control {
      background: #161b22 !important;
      border: 1px solid #30363d !important;
      color: #c9d1d9 !important;
      border-radius: 8px !important;
      padding: 0.75rem 1rem !important;
    }
    .form-control:focus {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.2) !important;
    }
    #loginBtn {
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Command Bar -->
  <nav class="cmdbar">
    <div class="cmdbar-brand">
      <span class="brand-dot"></span>
      DISASTERLINK
    </div>
    <div class="cmdbar-nav">
      <a href="index.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>
    </div>
  </nav>

  <div style="min-height:calc(100vh - 61px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;">
    <div class="auth-wrap glass-panel" style="padding:2.5rem;max-width:460px;width:100%;">

      <!-- Header -->
      <div style="text-align:center;margin-bottom:2rem;">
        <h1 style="font-size:1.6rem;font-weight:800;letter-spacing:0.02em;">Command Center Login</h1>
        <p style="font-size:0.85rem;color:var(--text-secondary);margin-top:0.4rem;">Select your role to authenticate</p>
      </div>

      <!-- Role Selector -->
      <div class="role-tabs" id="roleTabs">
        <div class="role-card active" id="tabAdmin" onclick="switchRole('admin')">
          <div class="indicator"></div>
          <div class="icon">⚙️</div>
          <div class="title">Admin</div>
          <div class="role-badge badge-command">COMMAND</div>
        </div>
        <div class="role-card" id="tabVolunteer" onclick="switchRole('volunteer')">
          <div class="indicator"></div>
          <div class="icon">🤝</div>
          <div class="title">Volunteer</div>
          <div class="role-badge badge-field">FIELD</div>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate style="display:flex;flex-direction:column;gap:1.5rem;">
        <div class="form-group" style="margin:0;">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="loginUsername" autocomplete="username" required placeholder="admin" />
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Password</label>
          <div style="position:relative;">
            <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required placeholder="Enter your password" style="padding-right:3rem;" />
            <button type="button" id="eyeToggle" onclick="togglePasswordVisibility()" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#8b949e;padding:0.2rem;display:flex;align-items:center;">
              <!-- eye-open icon -->
              <svg id="iconEyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <!-- eye-closed icon (hidden by default) -->
              <svg id="iconEyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div id="loginError" style="display:none;color:var(--danger);font-size:0.85rem;text-align:center;background:rgba(239,68,68,0.1);padding:0.75rem;border-radius:var(--radius-sm);border:1px solid rgba(239,68,68,0.2);"></div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn" style="margin-top:0.5rem;font-size:1rem;background-color:#3b82f6;">
          Login
        </button>
      </form>

      <!-- Volunteer register link -->
      <div id="volunteerRegisterLink" style="display:none;margin-top:1.5rem;text-align:center;font-size:0.87rem;color:var(--text-secondary);">
        New volunteer? <a href="volunteer_register.html" style="color:var(--primary);font-weight:600;text-decoration:none;">Register here →</a>
      </div>

    </div>
  </div>

  <div id="toastContainer"></div>
  <script src="script.js?v=2"></script>
  <script>
    let selectedRole = 'admin';

    function switchRole(role) {
      selectedRole = role;
      document.getElementById('tabAdmin').classList.toggle('active', role === 'admin');
      document.getElementById('tabVolunteer').classList.toggle('active', role === 'volunteer');
      document.getElementById('volunteerRegisterLink').style.display = (role === 'volunteer') ? 'block' : 'none';
      document.getElementById('loginUsername').placeholder = role === 'admin' ? 'admin' : 'Your username';
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('loginPassword');
      const open = document.getElementById('iconEyeOpen');
      const closed = document.getElementById('iconEyeClosed');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        open.style.display = 'none';
        closed.style.display = 'block';
      } else {
        pwd.type = 'password';
        open.style.display = 'block';
        closed.style.display = 'none';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById('loginError');
      errDiv.style.display = 'none';
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Authenticating…';

      const payload = {
        username: document.getElementById('loginUsername').value.trim(),
        password: document.getElementById('loginPassword').value,
        role: selectedRole,
      };

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Login failed');
        }
        const data = await res.json();

        if (data.role === 'admin') {
          localStorage.setItem('dl_admin_token', data.token);
          localStorage.setItem('dl_admin_name', data.name || 'Admin');
          showToast('🔓 Admin access granted!', 'success');
          setTimeout(() => { window.location.href = 'admin.html'; }, 800);
        } else {
          // Volunteer
          localStorage.setItem('dl_vol_token', data.token);
          localStorage.setItem('dl_vol_username', data.username);
          localStorage.setItem('dl_vol_name', data.name || data.username);
          if (data.volunteer_id) localStorage.setItem('dl_vol_id', data.volunteer_id);
          showToast('✅ Welcome, ' + (data.name || data.username) + '!', 'success');
          setTimeout(() => { window.location.href = 'volunteer.html'; }, 800);
        }
      } catch (err) {
        errDiv.textContent = '❌ ' + err.message;
        errDiv.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
